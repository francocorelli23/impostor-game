# Builds the app and runs the unit tests on every push and pull request.
# The debug APK is attached to each run under "Artifacts" for quick testing.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: impostor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
